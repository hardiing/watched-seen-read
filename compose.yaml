services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: watched_seen_read
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watched_seen_read"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command:
      - goose
      - -dir
      - /app/sql/schema
      - postgres
      - postgres://postgres:postgres@db:5432/watched_seen_read?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: postgres://postgres:postgres@db:5432/watched_seen_read?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      POLKA_KEY: ${POLKA_KEY}
      PLATFORM: ${PLATFORM}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
